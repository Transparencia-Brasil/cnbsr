on:
  push:
  pull_request:

name: lint

permissions: read-all

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::devtools
            any::lintr
      - name: Run lintr
        run: |
          devtools::load_all(quiet = TRUE)
          findings <- lintr::lint_package()
          print(findings)
          if (length(findings)) {
            stop("Lint encontrou problemas.")
          }
        shell: Rscript {0}
