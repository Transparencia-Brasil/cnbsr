name: Relatório de bug
description: Informe um comportamento incorreto ou inesperado
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Descrição
      description: O que aconteceu e o que era esperado?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reprodução mínima
      description: Inclua código e dados mínimos, sem informações sensíveis.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versões
      description: Informe as versões do cnbsr e do R.
